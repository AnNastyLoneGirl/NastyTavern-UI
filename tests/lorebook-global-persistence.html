<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lorebook global persistence regression</title>
<link rel="stylesheet" href="../style.css">
<style>body{background:#14171e;color:#e9eaf4;font:14px Arial,sans-serif;}#nt-lorebook-workspace{width:920px;height:600px;--mt-text:#e9eaf4;--mt-text-2:#c5c6d6;--mt-text-3:#999aaa;--mt-accent:#9bbfff;--mt-surface:#25252d;--mt-border:#454553;--mt-radius:12px;--nt-button-radius:8px;--mt-surface-2:#303039;}.nt-lorebook-library{height:100%}#result{white-space:pre-wrap}</style>
</head><body class="mt-enabled">
<div id="nt-lorebook-workspace" class="is-gallery-view nt-lorebook-gallery-ready"><div data-nt-lorebook-host>
<div id="WorldInfo"><div id="wi-holder">
<select id="world_info" multiple><option value="0" selected>Alpha</option><option value="1">Beta</option><option value="2" selected>Gamma</option></select>
<select id="world_editor_select"><option value="0">Alpha</option><option value="1">Beta</option><option value="2">Gamma</option></select>
</div></div>
</div></div>
<pre id="result">RUNNING</pre>
<script type="module">
import { LorebookManager } from '../src/lorebook-manager.js';
const out = document.getElementById('result');
let count=0; const assert=(ok,msg)=>{if(!ok)throw Error(msg);count++;};
const tick=()=>new Promise(r=>setTimeout(r,30));
const until=async fn=>{for(let i=0;i<100;i++){if(fn())return;await tick();}throw Error('timeout')};
try{
 const native = {world_names:['Alpha','Beta','Gamma'], selected_world_info:['Alpha','Gamma'],world_info:{globalSelect:['Alpha','Gamma']},onWorldInfoChange(){this.selected_world_info=[...document.getElementById('world_info').selectedOptions].map(o=>o.textContent);}};
 let server = {globalSelect:['Alpha','Gamma']};let changes=0;let saves=0;
 const selector=document.getElementById('world_info');
 selector.addEventListener('change',()=>{changes++;native.onWorldInfoChange();});
 const root=document.getElementById('nt-lorebook-workspace');const panel=document.getElementById('WorldInfo');
 const manager=new LorebookManager({lorebookStudio:{sort:'az'}}, msg=>{throw Error('Unexpected toast '+msg)}, {
  loadNativeWorldInfo: async()=>native,
  saveNativeWorldInfo:async()=>{saves++;server.globalSelect=[...native.world_info.globalSelect];},
  onShowGallery:()=>{},
  isBookEnabled:()=>true,
 });
 assert(await manager.mount(root,panel)===true,'Gallery mounted');
 assert(panel.isConnected,'Native WorldInfo stays connected on initial gallery');
 assert(selector.isConnected,'#world_info remains connected in gallery');
 assert(document.querySelector('#world_info')===selector,'Native global lookup finds original select');
 assert(manager.gallery.isConnected && !manager.gallery.hidden,'Gallery visible');
 assert(manager.editorView.isConnected && manager.editorView.hidden,'Editor remains in DOM while hidden');
 assert(getComputedStyle(manager.editorView).display==='none','Hidden editor occupies no layout');
 const btn=name=>[...manager.gallery.querySelectorAll('[data-nt-lorebook-global]')].find(b=>b.dataset.ntLorebookGlobal===name);
 assert(btn('Beta').getAttribute('aria-pressed')==='false','Beta starts inactive');
 btn('Beta').click(); await until(()=>saves===1);
 assert(JSON.stringify(server.globalSelect)===JSON.stringify(['Alpha','Beta','Gamma']),'Three Global books persisted to native settings');
 assert(btn('Beta').getAttribute('aria-pressed')==='true','Beta indicates Global ON');
 assert(changes===1,'Only one native change event on Global ON');
 manager.showEditor('Beta');
 assert(panel.isConnected && selector.isConnected,'Native selector remains connected in editor');
 assert(manager.editorView.isConnected && !manager.editorView.hidden,'Editor visible');
 assert(manager.gallery.hidden && getComputedStyle(manager.gallery).display==='none','Gallery hidden without detachment');
 manager.showGallery(); await until(()=>manager.gallery.hidden===false);
 assert(panel.isConnected && selector.isConnected,'Native selector still connected on gallery return');
 assert(manager.editorView.hidden && getComputedStyle(manager.editorView).display==='none','No stacked editor on gallery');
 btn('Gamma').click(); await until(()=>saves===2);
 assert(JSON.stringify(server.globalSelect)===JSON.stringify(['Alpha','Beta']),'Removing Gamma saves Alpha and Beta');
 assert(changes===2,'Exactly two native changes');
 // Page-reload simulation: saved server list is source of truth for a fresh module.
 const reloaded=[...server.globalSelect];
 assert(reloaded.includes('Alpha')&&reloaded.includes('Beta')&&!reloaded.includes('Gamma'),'Saved Global list survives reload');
 manager.unmount({keepNative:true});
 assert(panel.isConnected,'Native panel restored to document after unmount');
 assert(document.querySelector('#world_info')===selector,'Native WorldInfo selector survives unmount');
 out.textContent=`PASS (${count} assertions): native panel stays connected, toggle sync and immediate durable saves`;
 out.dataset.status='pass';
}catch(error){out.textContent='FAIL: '+error.stack;out.dataset.status='fail';}
</script></body></html>
