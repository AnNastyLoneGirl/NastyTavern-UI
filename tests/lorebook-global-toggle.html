<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Global Lorebook Switch Regression</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root { --mt-surface:#20252d;--mt-surface-2:#292f39;--mt-border:#485261;--mt-text:#f8fafc;--mt-text-2:#c2c9d5;--mt-text-3:#909baa;--mt-accent:#91a4fe;--nt-control-border:#636c7e;--nt-button-bg:#323946;--nt-button-bg-hover:#465062;--nt-tab-border-active:#91a4fe;--nt-tab-bg-active:#333d60;--mt-radius:12px;--nt-button-radius:8px;--nt-font-meta:12px;--nt-font-body:14px;--nt-font-secondary:12px; }
    body { margin:20px;background:#12171e;color:#fff;font-family:Arial,sans-serif; }
    #nt-lorebook-workspace { max-width:920px;height:600px; }
    .nt-lorebook-library {height:100%;}
    #world_info,#world_editor_select {display:none;}
    #results {white-space:pre-wrap;}
  </style>
</head>
<body class="mt-enabled">
<select id="world_info" multiple>
  <option value="0" selected>Alpha</option>
  <option value="1">Beta</option>
  <option value="2" selected>Gamma</option>
</select>
<select id="world_editor_select">
  <option value="0">Alpha</option>
  <option value="1">Beta</option>
  <option value="2">Gamma</option>
</select>
<div id="nt-lorebook-workspace"><div class="nt-lorebook-library" id="gallery"></div></div>
<pre id="results">RUNNING</pre>
<script type="module">
import { LorebookManager } from '../src/lorebook-manager.js';
const output = document.getElementById('results');
const checks = [];
function assert(value, message) { if (!value) throw new Error(message); checks.push(message); }
const tick = () => new Promise(resolve => setTimeout(resolve, 50));
async function until(test) { for (let i = 0; i < 40; i++) { if (test()) return; await tick(); } throw Error('Timed out waiting for state'); }
try {
  const disabled = new Set(['Gamma']);
  const native = { world_names: ['Alpha', 'Beta', 'Gamma'], selected_world_info: ['Alpha', 'Gamma'], world_info: { globalSelect: ['Alpha', 'Gamma'] } };
  let savedGlobals = ['Alpha', 'Gamma'];
  const manager = new LorebookManager({ lorebookStudio: { sort: 'az' } }, () => { throw Error('Unexpected toast'); }, {
    isBookEnabled: name => !disabled.has(name),
    setBookEnabled: (name, enabled) => { enabled ? disabled.delete(name) : disabled.add(name); return true; },
    loadNativeWorldInfo: async () => native,
    saveNativeWorldInfo: async () => { savedGlobals = [...native.world_info.globalSelect]; },
  });
  manager.gallery = document.getElementById('gallery');
  manager.panel = document;
  manager.gallery.addEventListener('click', manager.boundClick);
  manager.gallery.addEventListener('input', manager.boundInput);
  const select = document.getElementById('world_info');
  let updates = 0;
  select.addEventListener('change', () => { updates++; native.selected_world_info = [...select.selectedOptions].map(o => o.textContent); });
  await manager.refresh();
  function globalButton(name) { return [...document.querySelectorAll('[data-nt-lorebook-global]')].find(node => node.dataset.ntLorebookGlobal === name); }
  function masterSwitch(name) { return [...document.querySelectorAll('[data-nt-lorebook-enabled]')].find(node => node.dataset.ntLorebookEnabled === name); }
  assert(globalButton('Alpha').getAttribute('aria-pressed') === 'true', 'Alpha is native Global');
  assert(globalButton('Beta').getAttribute('aria-pressed') === 'false', 'Beta is not Global');
  assert(masterSwitch('Alpha').getAttribute('aria-checked') === 'true', 'Alpha master enabled');
  assert(masterSwitch('Beta').getAttribute('aria-checked') === 'true', 'Beta unbound master enabled');
  assert(masterSwitch('Gamma').getAttribute('aria-checked') === 'false', 'Gamma master disabled');
  assert(masterSwitch('Gamma').getAttribute('role') === 'switch', 'Semantic master switch');
  assert(masterSwitch('Gamma').textContent.trim() === 'Off', 'Visible master OFF label');
  globalButton('Beta').click();
  await until(() => globalButton('Beta')?.getAttribute('aria-pressed') === 'true');
  assert([...select.selectedOptions].some(o => o.textContent === 'Beta'), 'Native Global selector receives click');
  assert(updates === 1, 'Exactly one Global change event');
  assert(savedGlobals.includes('Beta') && savedGlobals.includes('Alpha') && savedGlobals.includes('Gamma'), 'Saved Global selection persists all books');
  assert(masterSwitch('Beta').getAttribute('aria-checked') === 'true', 'Global click does not change master switch');
  masterSwitch('Gamma').click();
  await until(() => masterSwitch('Gamma')?.getAttribute('aria-checked') === 'true');
  assert(!disabled.has('Gamma'), 'Master ON works without Global change');
  assert(updates === 1, 'Master switch does not touch Global selection');
  masterSwitch('Alpha').focus();
  masterSwitch('Alpha').click();
  await until(() => masterSwitch('Alpha')?.getAttribute('aria-checked') === 'false');
  assert(disabled.has('Alpha'), 'Master OFF persisted');
  assert(document.activeElement === masterSwitch('Alpha'), 'Master switch preserves keyboard focus');
  assert(globalButton('Alpha').getAttribute('aria-pressed') === 'true', 'Master OFF does not remove Global link');
  const search = manager.gallery.querySelector('[data-nt-lorebook-search]');
  search.focus(); search.value = 'al'; search.dispatchEvent(new Event('input', { bubbles: true }));
  assert(document.activeElement === search, 'Search remains focused');
  assert(masterSwitch('Alpha') && !masterSwitch('Beta'), 'Search filters independently');
  masterSwitch('Alpha').click();
  await until(() => masterSwitch('Alpha')?.getAttribute('aria-checked') === 'true');
  assert(document.activeElement === search, 'Toggling master does not steal search focus');
  search.value = ''; search.dispatchEvent(new Event('input', { bubbles: true }));
  manager.filter = 'global'; manager.renderGallery();
  assert(globalButton('Alpha') && globalButton('Beta') && globalButton('Gamma'), 'Native Global filter unaffected by master status');
  output.textContent = `PASS (${checks.length} assertions): universal ON/OFF, independent Global selector, focus and filtering`;
  output.dataset.status = 'pass';
} catch(error) { output.textContent = 'FAIL: ' + error.stack; output.dataset.status = 'fail'; }
</script>
</body>
</html>
