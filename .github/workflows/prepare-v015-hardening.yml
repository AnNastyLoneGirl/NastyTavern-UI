name: Prepare v0.1.5 hardening

on:
  push:
    branches:
      - security/v0.1.5-hardening
    paths:
      - '.github/workflows/prepare-v015-hardening.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/v0.1.5-hardening
          fetch-depth: 0

      - name: Prepare and validate v0.1.5
        shell: bash
        run: bash .release/prepare-v015.sh

      - name: Remove temporary preparation files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release/prepare-v015.sh
          rm -f .github/workflows/prepare-v015-hardening.yml
          rmdir .release 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: harden v0.1.5 dependency and maintenance boundaries'
          git push origin HEAD:security/v0.1.5-hardening
