name: Apply Home changelog release fixed
on:
  push:
    branches:
      - release/v0.1.5-home-changelog-final7
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tested patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/home-changelog.patch
          echo '770942120fc287b11b1aea67cd5dbcd00876718e0ec09a5e4667540f08124f37  /tmp/home-changelog.patch' | sha256sum -c -
          git apply --check /tmp/home-changelog.patch
          git apply /tmp/home-changelog.patch
          rm -f .github/workflows/apply-home-changelog-release-fixed.yml
      - name: Validate release source
        shell: bash
        run: |
          node --check index.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json
          for path in ['manifest.json', 'locales/en.json', 'locales/fr-fr.json']:
              with open(path, encoding='utf-8') as fh:
                  json.load(fh)
          PY
          test "$(python -c "import json; print(json.load(open('manifest.json'))['version'])")" = '0.1.5'
          test "$(python -c "import json; print(json.load(open('manifest.json'))['display_name'])")" = 'NastyTavern UI'
          test ! -e .github/workflows/apply-home-changelog-release-fixed.yml
          test -f src/update-checker.js
      - name: Commit release source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Home release changelog and updater'
          git push origin HEAD:release/v0.1.5-home-changelog-final7
